[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-panhound"
version = "0.1.1"
description = "Scans code, logs, fixtures, and S3 buckets for leaked PANs (Luhn-validated card numbers) and CVVs before they hit prod."
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "fintech", "panhound"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/panhound"

[project.scripts]
"panhound-emit" = "panhound.connect:emit_main"
panhound = "panhound.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["panhound"]

[tool.hatch.metadata]
allow-direct-references = true
